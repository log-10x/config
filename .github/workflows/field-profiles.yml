name: Field profiles

on:
  pull_request:
    paths:
      - 'pipelines/run/fields/**'
      - 'pipelines/run/transform/fields/**'
      - 'tests/field-profiles.test.mjs'
      - '.github/workflows/field-profiles.yml'

permissions:
  contents: read

jobs:
  options:
    name: declared options
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/field-profiles.test.mjs
