# yaml-language-server: $schema=https://schema.log10x.com/pipelines/run/output/metric/datadog/schema.json

# 🔟❎ 'run' Datadog metric output configuration

# Configure Datadog metric counter outputs.
# To learn more see https://doc.log10x.com/run/output/metric/datadog/

# Set the 10x pipeline to 'run'
tenx: run

# =============================== Dependencies ================================

include: run/modules/output/metric/datadog

# ============================== Datadog Options ==============================

# Define multiple Datadog metric outputs below
datadog:
  
    # --------------------------- Connection Options --------------------------

    # 'apiKey' sets the Datadog API key (required). 'applicationKey' is optional: the
    #  output publishes without it, and with 'count' series it lets the output set units.
    #  To learn more see: https://docs.datadoghq.com/account_management/api-app-keys/
  - apiKey: $=TenXEnv.get("DD_API_KEY")         # (EnvVar REQUIRED)

    applicationKey: $=TenXEnv.get("DD_APP_KEY") # (EnvVar optional)

    # 'uri' sets the Datadog site address to which to connect.
    #  'DD_SITE' is the bare site domain (e.g. 'us5.datadoghq.com', 'datadoghq.eu'),
    #  matches the Datadog Agent convention so existing cluster secrets work as-is.
    #  To learn more see: https://docs.datadoghq.com/getting_started/site/
    uri: $="https://" + TenXEnv.get("DD_SITE", "us5.datadoghq.com")

    # ---------------------------- Publish Options ----------------------------

    # 'metricType' sets how counters reach Datadog. 'distribution' posts distribution
    #  points, which Datadog merges across every node sending the same tag set, so the
    #  fleet total is exact with no host tag. 'count' posts count series, which Datadog
    #  keeps one per second per tag set, so nodes sharing a tag set overwrite each other.
    #  To learn more see: https://docs.datadoghq.com/metrics/distributions/
    metricType: distribution

    # 'metricPrefix' is prepended to each distribution's name:
    #  log10x.emitted_events_summaryBytes, log10x.all_events_summaryVolume, and so on.
    metricPrefix: log10x.

    # 'descriptions' sets whether to send meter descriptions to Datadog
    #  Turn this off to minimize the amount of data sent on each write
    descriptions: false

    # 'step' sets the interval to send metrics to Datadog (e.g., '1m').
    #  To learn more see: https://micrometer.io/docs/concepts#rate-aggregation
    step: 5s

    # ---------------------------- Counter Options ----------------------------

    # 'nameField' sets the TenXSummary field whose value identifies the micrometer counter to increment. 
    #  The 'inputName' field returns the name of the aggregator that produced the target TenXSummary instance.
    #  To learn more see https://doc.log10x.com/run/aggregate
    nameField: inputName

    # 'counterFields' specifies the TenXSummary fields whose values are used to increment the counter.
    #  To learn more see https://doc.log10x.com/run/aggregate/#summary-fields
    counterFields:
      - summaryVolume
      - summaryBytes
      - summaryTotals

    # 'tagFields' sets the TenXSummary fields used as the counter tag dimension values.
    #  Datadog bills each distinct tag set, so this list carries the pattern, where it
    #  ran and the team that owns it (when the k8s team label is set), and nothing that
    #  names one node or one process. Every node sends the same sets and Datadog merges
    #  their distribution points, so the count does not grow with the fleet. A listed
    #  field that no summary carries is sent as a tag with an empty value, so the team
    #  field is listed only when the label is set.
    tagFields:
      - message_pattern
      - tenx_hash
      - tenx_user_service
      - severity_level
      - routeState=l1e_routeState
      - k8s_container
      - k8s_namespace
      - $=yield TenXEnv.get("k8sTeamLabel") ? TenXEnv.get("k8sTeamField", "tenx_team"):""

    # 'topSeries' keeps the output to the tag sets with the most bytes, ranked on the
    #  summaryBytes counter as the series accumulate. A set outside the top keeps
    #  accumulating and is published once it enters it. 0 publishes every set. With
    #  two aggregators and two counters, 200 sets are 800 distributions, billed as
    #  4,000 custom metrics on any fleet size, inside a Pro plan's allotment from 40
    #  hosts up.
    topSeries: 200

    # 'maxCardinality' caps the counters the output keeps; above it, counters idle for a
    #  few seconds are dropped, with the counts of the step in progress. 200 tag sets
    #  with two aggregators and two counters are 800 counters, so the cap sits above it.
    maxCardinality: 2000

    # 'tagFieldNames' allows setting custom names to aggregated fields for metrics reporting.
    #  Defaults to https://doc.log10x.com/run/initialize/#metricFieldNames
    tagFieldNames:
      - $=yield TenXEnv.get("metricFieldNames")

    # 'filter' sets a JavaScript expression that TenXSummaries must evaluate as truthy to write to the output.
    #  To learn more see https://doc.log10x.com/run/output/receive/#filter-expressions
    filter: isSummary
