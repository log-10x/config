# yaml-language-server: $schema=https://schema.log10x.com/pipelines/run/transform/fields/schema.json

# Splunk Stream IP events in JSON (source stream:ip).
# Verified with the Splunk Add-on for Stream Wire Data 8.1.7 and CIM 8.8.0.
# Fills the CIM Network_Traffic data model.

tenx: run

field:
  readers: [json]

compactFields:
  - 'bytes'
  - 'bytes_in'
  - 'bytes_out'
  - 'dest_ip'
  - 'dest_mac'
  - 'flow_id'
  - 'packets_in'
  - 'packets_out'
  - 'protocol'
  - 'src_ip'
  - 'src_mac'
  - 'tos'
