# yaml-language-server: $schema=https://schema.log10x.com/pipelines/run/input/forwarder/datadogAgent/schema.json

# 🔟❎ 'run' Datadog Agent receiver configuration
#
# The Datadog Agent integration is a Fluent Bit file-relay (see doc.md for
# the data flow). The 10x leg uses the Fluent Bit module's options below.
#
# Every endpoint setting below reads an environment variable first and falls
# back to the shipped default, so a deployment can move a port, a host or a
# socket path without editing this file. The variable name is the launch
# option name in upper snake case with a TENX_ prefix, and because this
# integration drives the Fluent Bit module the names are the Fluent Bit ones,
# for example the `fluentbitInputPort` option reads TENX_FLUENTBIT_INPUT_PORT.
#
# To learn more see https://doc.log10x.com/run/input/forwarder/datadogAgent/

tenx: run

# =============================== Dependencies ================================

include:
  - run/input/forwarder/config.yaml
  - run/modules/input/forwarder/fluentbit

# ============================= Fluent Bit Options ============================

fluentbit:

  # ----------------------------- Input Options -----------------------------

  input:

    # 'port' specifies the TCP port to listen on for events from Fluent Bit's
    #  forward output plugin.
    #  Env var: TENX_FLUENTBIT_INPUT_PORT
    port: $=TenXEnv.get("TENX_FLUENTBIT_INPUT_PORT", 24224)

    # 'path' switches the input to a Unix domain socket instead of TCP.
    #  When set, takes precedence over 'port'. Empty means TCP.
    #  Env var: TENX_FLUENTBIT_INPUT_PATH
    path: $=TenXEnv.get("TENX_FLUENTBIT_INPUT_PATH", "")

    # 'messageField' is the name of the JSON field in each Fluent Bit record
    #  carrying the log line text.
    messageField: log

  # ----------------------------- Output Options ----------------------------

  output:

    # 'host' specifies the TCP host of Fluent Bit's forward input receiving
    #  processed events from Log10x.
    #  Env var: TENX_FLUENTBIT_OUTPUT_HOST
    host: $=TenXEnv.get("TENX_FLUENTBIT_OUTPUT_HOST", "127.0.0.1")

    # 'port' specifies the TCP port of Fluent Bit's forward input. MUST differ
    #  from input.port or the two would collide on the same listener.
    #  Env var: TENX_FLUENTBIT_OUTPUT_PORT
    port: $=TenXEnv.get("TENX_FLUENTBIT_OUTPUT_PORT", 24225)

    # 'path' switches the output to a Unix domain socket instead of TCP.
    #  When set, takes precedence over 'host'/'port'. Empty means TCP.
    #  Env var: TENX_FLUENTBIT_OUTPUT_PATH
    path: $=TenXEnv.get("TENX_FLUENTBIT_OUTPUT_PATH", "")

    # 'encodeType' is the on-wire format for the Forward record.
    #  - 'delimited': each top-level field of the rendered record becomes its
    #    own Forward record field, preserves the original record's structure.
    #  - 'json': the whole record is wrapped as one stringified field.
    encodeType: delimited
