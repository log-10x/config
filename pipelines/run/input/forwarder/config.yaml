# yaml-language-server: $schema=https://schema.log10x.com/pipelines/run/input/forwarder/schema.json

# 🔟❎ 'run' shared forwarder configuration
#
tenx: run

# =============================== Dependencies ================================

include:

  # Shared forwarder options (mode dispatch, output encoding)
  - run/modules/input/forwarder/module.yaml

# =============================== Mode Options ================================
#
# The Receiver app picks the encoding mode based on user flags:
#   default                      → emit events verbatim (`fullText`)
#   receiverOptimize=true        → compact-all (lossless compaction of every event)
#   compactReceiverLookupFile=…  → compact-lookup (per-pattern decision: listed patterns follow their row, the rest compactReceiverDefault)
#
# `symbolMessageHashField` (optional, unset by default) adds a stable
# pattern-hash field alongside the encoded/fullText output: when set, encode()
# and fullText are called as `encode("<field>")` / `fullText("<field>")`.
#
# Unset is the receive-path default and it means VERBATIM: the record the
# forwarder gets back is the record it sent, byte for byte, with no field added.
# The hash is still computed and still rides the TenXObject internally as
# `tenx_hash` for metrics and aggregation, it just does not reach the wire.
# `symbolMessageHashField my_custom_hash` (CLI arg or env var) opts in and names
# the field.

output:

  # outputEncodeFilter is the condition under which the Receiver compacts an
  # event with encode(); it writes every other event fullText. Resolved once
  # here, so the output expression below and the compact_events aggregator in
  # run/aggregate/receive read the same condition:
  #   outputOffload truthy           → false                          (offload ships full text)
  #   outputSoftDrop truthy          → isRoute("compact") || <decide> (the compact-marked slice, plus what <decide> selects)
  #   compactReceiverLookupFile set  → shouldEncode()                 (the cap file's per-pattern decision; unlisted patterns follow compactReceiverDefault)
  #   receiverOptimize truthy        → true                           (every event of the source)
  #   none of them                   → false                          (receive mode)
  #   <decide> is shouldEncode() with a cap file, else true under receiverOptimize, else false.
  encodeFilter: |-
    $=yield TenXEnv.get("outputOffload")
      ? "false"
      : ((TenXEnv.get("outputSoftDrop") ? "isRoute(\"compact\") || " : "")
          + (TenXEnv.get("compactReceiverLookupFile") ? "shouldEncode()" : (TenXEnv.get("receiverOptimize") ? "true" : "false")))

  # outputEncodeField is the per-event output field expression: encode() where
  # outputEncodeFilter holds, fullText(...) otherwise. Written as a YAML `|-`
  # block scalar for readability: the engine treats the newlines and indentation
  # between tokens as whitespace, and block scalars keep the `\"` below as is.
  #
  # The offload and soft-drop modes splice the `routeState` field onto every
  # forwarded event, so the forwarder can route by the per-service action name
  # (offload → the customer's own S3, tier_down → the SIEM cheap tier, compact →
  # encoded bytes to the SIEM, pass/sample → the SIEM). The splice writes the
  # route NAME as a JSON STRING (e.g. `"routeState":"offload"`), so a forwarder
  # match must be string equality against the action name, NOT truthiness.
  # `symbolMessageHashField`, when set, ships the pattern hash beside it.
  #
  # Receive mode calls the fullText(...) FUNCTION, not the bare `fullText`
  # field. The field splices the decoded body back between the JSON quotes
  # unescaped and joins grouped lines with ",", so any record whose message
  # holds a `"` stopped parsing and reached the forwarder as
  # {"fullText": "<record as text>"} (measured with Fluent Bit 5.1.2 + edge
  # 1.1.81: 1,030 of 1,453 records). The function re-escapes and joins on "\n".
  # It takes at least one extra-field name, and a name no event carries adds
  # nothing: `tenx_passthrough` is never stamped, so records keep exactly the
  # keys they arrived with.
  encodeField: |-
    $=yield "encoded=(" + TenXEnv.get("outputEncodeFilter") + ") ? encode("
      + (TenXEnv.get("symbolMessageHashField")
          ? ("\"" + TenXEnv.get("symbolMessageHashField") + "\"" + ((TenXEnv.get("outputOffload") || TenXEnv.get("outputSoftDrop")) ? "," : ""))
          : "")
      + ((TenXEnv.get("outputOffload") || TenXEnv.get("outputSoftDrop")) ? "\"routeState\"" : "")
      + ") : fullText("
      + (TenXEnv.get("symbolMessageHashField")
          ? ("\"" + TenXEnv.get("symbolMessageHashField") + "\"" + ((TenXEnv.get("outputOffload") || TenXEnv.get("outputSoftDrop")) ? "," : ""))
          : "")
      + ((TenXEnv.get("outputOffload") || TenXEnv.get("outputSoftDrop"))
          ? "\"routeState\""
          : (TenXEnv.get("symbolMessageHashField") ? "" : "\"tenx_passthrough\""))
      + ")"

  # outputWriteTemplates = true whenever events are encoded (compact-all or soft-drop)
  writeTemplates: $=yield TenXEnv.get("compactReceiverLookupFile") || TenXEnv.get("receiverOptimize") || TenXEnv.get("outputSoftDrop")

  # outputDropFilter decides whether a (possibly regulator-marked) object is written.
  # Resolved ONCE here so the soft/hard logic lives next to encodeField instead of
  # being duplicated in every output stream; streams just reference $?outputDropFilter.
  # (Named outputDropFilter, not outputFilter -- the latter is a built-in per-stream
  # engine option and would collide.)
  #   outputSoftDrop or outputOffload truthy → "isObject"                    (write all; dropped events flow for routing/compaction)
  #   unset (hard, default)                  → "isObject && !this.isRoute("drop")" (omit dropped objects)
  dropFilter: '$=yield (TenXEnv.get("outputSoftDrop") || TenXEnv.get("outputOffload")) ? "isObject" : "isObject && !this.isRoute(\"drop\")"'

