# yaml-language-server: $schema=https://schema.log10x.com/pipelines/run/transform/symbol/schema.json

# 🔟❎ 'run' symbol origin configuration

# Identify the origin of symbol values within TenXTemplates.
# To learn more see https://doc.log10x.com/run/transform/symbol/

# Set the 10x pipeline to 'run'
tenx: run

# =============================== Origin Options ==============================

symbol:

  # 'maxOrigins' controls the number of source/binary origins to list 
  #  per symbol token sequence. As a series of tokens within 
  #  a target TenXTemplate (e.g., 'ERROR', 'could not connect to "{}') may appear 
  #  in multiple source/binary files within the pipeline's loaded library.
  #  The first 'maxOrigins' units holding the sequence are read in library
  #  order: library files by file name, and within a file the units by name,
  #  so the same libraries give the same origins on every node.
  maxOrigins: 64
  
  # 'sequenceReserved' defines a list of terms to ignore when searching
  #  for the symbol tokens that constitute an TenXTemplate's 'message' portion.
  #  For example, for an event whose text contains: 'connect success = true',
  #  the value 'true' will not be considered a part of the event's message,
  #  as the 'true' value is mostly likely the result of a variable boolean state.
  #  For more information, see: https://doc.log10x.com/api/js/#TenXObject+symbolSequence
  sequenceReserved:
    # literals
    - "null"
    - "nil"
    - "true"
    - "false"
    # stopwords (articles, conjunctions, prepositions)
    - "a"
    - "an"
    - "the"
    - "to"
    - "of"
    - "in"
    - "on"
    - "at"
    - "by"
    - "for"
    - "from"
    - "with"
    - "and"
    - "or"
    - "as"
    - "is"
    # generic log words
    - "log"
    - "logger"
    - "logs"
    - "http"
    - "https"
    # severity levels, uppercase
    - TRACE
    - DEBUG
    - INFO
    - NOTICE
    - WARN
    - WARNING
    - ERROR
    - ERR
    - CRITICAL
    - CRIT
    - ALERT
    - EMERGENCY
    - EMERG
    - FATAL
    - PANIC
    # severity levels, lowercase (engine matching is case-sensitive).
    #  'error' and 'emergency' are not reserved: an 'error' key often
    #  carries the message itself, and 'emergency' appears as prose.
    - "trace"
    - "debug"
    - "info"
    - "notice"
    - "warn"
    - "warning"
    - "err"
    - "critical"
    - "crit"
    - "alert"
    - "fatal"
    - "panic"
    # severity-equivalent envelope keys
    - "level"
    - "levelname"
    - "severity"
    # envelope time keys
    - "time"
    - "timestamp"
    - "ts"
    # 'msg' and 'message' are message keys (see 'preamble.messageKeys')
    # OpenTelemetry / collector envelope
    - "otel"
    - "otelcol"
    - "opentelemetry"
    - "collector"
    - "contrib"
    - "processor"
    - "processors"
    - "receiver"
    - "receivers"
    - "exporter"
    - "exporters"
    - "pipeline"
    - "pipelines"
    # structured / envelope keys, singular and plural (matching is exact)
    - "service"
    - "services"
    - "instance"
    - "instances"
    - "component"
    - "components"
    - "signal"
    - "signals"
    - "resource"
    - "resources"
    - "scope"
    - "scopes"
    - "attribute"
    - "attributes"
    - "traces"
    - "span"
    - "spans"
    - "flag"
    - "flags"
    - "context"
    - "contexts"
    - "baggage"
    # Kubernetes API / audit envelope
    - "metadata"
    - "namespace"
    - "verb"
    - "uid"
    - "identity"
    - "protocol"
    - "priority"
    - "encoding"
    - "headers"
    - "duration"
    # HTTP / request envelope
    - "path"
    - "status"
    # generic identity keys (very common envelope tokens in JSON logs)
    - "id"
    - "name"
    - "kind"
    - "version"
    - "type"
    # source-location envelope (Go / Java / Python loggers print these)
    - "caller"
    - "func"
    - "function"
    - "file"
    - "line"
    - "module"
    - "package"
    - "class"
    - "method"
    - "stack"
    - "stacktrace"
    # process / runtime context. 'host' and 'app' are not reserved:
    #  'host' is message text in 'no such host', and 'app' is the Flask
    #  logger name that tells one application's statements from another's.
    - "pid"
    - "tid"
    - "process"
    - "thread"
    - "hostname"
    - "application"
    # package-qualifier prefixes (Go / Java loggers embed these in
    # source-path tokens like `com.foo.bar.MyLogger`)
    - "com"
    - "org"
    - "io"
    - "net"
    # tokenizer artifacts
    - "t"

  # 'preamble' describes the envelope a line carries before its message: the
  #  words that stay out of a TenXTemplate's message name. The line is read
  #  left to right, and the message starts at the first word that is not in
  #  'sequenceReserved', not a message key, not inside an enclosure and not a
  #  reserved key or its value; from there every word goes into the name as
  #  written. A word these lists do not describe is message text, a logger or
  #  class name included. 'joiners' only decides which record of a multi-line
  #  event names it (see 'groupLead').
  #  For more information, see: https://doc.log10x.com/run/transform/symbol/
  preamble:

    # 'enclosures' lists open and close character pairs: text inside them
    #  before the message is envelope (e.g., 'main' in '[main] Starting worker').
    #  An open with no close after it in the same field encloses nothing, such
    #  as the '[' of a color code ('\033[0;33mWARN') or one that closes on a
    #  later line of a multi-line event.
    enclosures: ['[]', '()']

    # 'assigners' lists the characters that bind a key to its value when the
    #  key or the value is quoted ('"level":"info"', "body: 'Charge request
    #  received.'"). A reserved key and its value are envelope; a message key's
    #  value is where the message starts (see 'messageKeys'). Unquoted, a colon
    #  binds nothing: 'Error: 13 INTERNAL' and 'INFO:root:Starting' keep their words.
    assigners: ['=', ':']

    # 'bareAssigners' lists the assigners that also bind an unquoted key to an
    #  unquoted value, as logfmt writes them ('level=info', 'logger=cleanup').
    bareAssigners: ['=']

    # 'joiners' lists the separators that chain two or more words, written
    #  without whitespace, into one name ('org.apache.kafka.log.LocalLog',
    #  'cart.cartstore.ValkeyCartStore'). They decide only which member of a
    #  multi-line event leads it (see 'groupLead'). In a message name a joined
    #  name stays: a logger or class name is often the only text that tells
    #  two statements apart.
    joiners: ['.', '::']

    # 'messageKeys' lists the keys whose value holds the message. The message
    #  starts at the value's first word that is not reserved, not enclosed and
    #  not a reserved key or its value:
    #  'starting' in 'msg=starting', 'Subchannel' in
    #  '"msg":"[core][Channel #1] Subchannel created"', 'Charge' in
    #  "body: 'Charge request received.'". In a record that opens with '{',
    #  reading starts at the first message key with a value. A message key
    #  without a value is envelope, as a reserved word is.
    messageKeys: [msg, message, body]

  # 'groupLead' selects the member of a multi-line event group that names it.
  #  'firstWithMessage' names a group from its first member that is not all
  #  envelope, a joined name ('joiners') counting as envelope here, so a head
  #  such as the .NET console logger's 'info: cart.cartstore.ValkeyCartStore[0]'
  #  before the record that holds the message leaves the name, origin and
  #  skeleton to that record.
  #  A head that holds a message, such as a stack trace's, names the group.
  #  'head' always names a group from its head.
  groupLead: firstWithMessage

  # ----------------------------- Debug Options -------------------------------
  
  debug:
 
    # 'symbol' debugging allows for verbose printing of the selection process
    #  for symbol tokens from the pipeline's 10x symbol files used to produce the
    #  results of 10x reflection functions.
    #  For more information, see: https://doc.log10x.com/api/js/#TenXObject+symbol
    

   # 'loggerName' controls the name of the log4j logger used by origins and symbols below
    loggerName: "symbolDebugger"

    # 'origins' outputs information about the origin selection process for an TenXTemplate symbol.
    #  For example, setting 'units' to 'foo.js' will output information about if/how it 
    #  was selected as the origin of TenXTemplate symbols.
    #  In other words, if a symbol (e.g., 'MyClass') has 'foo.java' as the source file
    #  from which it originated, adding 'foo.js' to 'units' will emit information
    #  about the selection process.
    #  Specifying '*' will emit information for all source /binary files that have
    #  been selected as the origin of any TenXTemplate objects within the pipeline.
    origins: [
    #  '*'
    ]

    # 'symbols' logs the origin selection process for symbol tokens within an TenXTemplate.
    #  For example, set 'symbols' to 'Could not connect to' to log how the 10x JavaScript 'symbolSequence' 
    #  determines the origin source code/binary file within the pipeline's symbol library. 

    #  Specifying '*' will emit information for all source code /binary files that have
    #  been selected as the origin of any TenXTemplate objects within the pipeline.
    symbols: [
    #  '*'
    ]
