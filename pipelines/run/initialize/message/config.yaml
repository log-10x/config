# yaml-language-server: $schema=https://schema.log10x.com/pipelines/run/initialize/message/schema.json

# 🔟❎ 'run' symbol lookup configuration

# Configure a symbol origin lookup to enrich TenXObjects
# To learn more see https://doc.log10x.com/run/initialize/message/

# Set the 10x pipeline to 'run'
tenx: run

# =============================== Dependencies ================================

include: run/modules/initialize/message

# ============================== Symbol Options ===============================

symbol:

  # 'contexts' lists the kinds of symbols that can name an event: 'log' is text
  #  passed to a logging call in source code, 'exec' is text read from a program
  #  file. Values, in any case: package, class, method, log, enum, const, text,
  #  exec, any. Order does not matter.
  #  To learn more see https://doc.log10x.com/run/transform/symbol/#contexts
  contexts: log,exec

  # 'messageField' is the field that holds each event's name.
  messageField: message_pattern

  # 'messageHashField' is the field that holds an 11-character hash of the name.
  #  Metrics and aggregation carry the hash either way. Name a field here to also
  #  add the hash to events sent back to a log forwarder:
  #
  # messageHashField: tenx_hash

  # 'maxLen' is the longest name to write, in characters. 0 means no limit.
  maxLen: 120

# ============================== Message Options ==============================

# 'negators' lists line starts that mark a line as a continuation of the event
# above it, such as a stack frame. A continuation line that arrives as its own
# event is named by its shape, template_<hash>, and not from the symbol library.
message:
  negators:
    - " "                 # any indented line (stack frames, indented app detail, multi-line JSON, banners)
    - "\t"                # real tab byte, for msgpack/forward inputs that preserve raw whitespace
    - "\\t"               # literal backslash+t, for file/JSON inputs that keep escape sequences raw
    - "Caused by: "       # Java chained exception (column 0)
    - "Suppressed: "      # Java suppressed exception (column 0)
    - "--- End of "       # .NET inner exception marker (column 0)
    - "created by "       # Go goroutine creator (column 0)
    - "#0 "               # PHP stack frame depth 0
    - "#1 "               # PHP stack frame depth 1
    - "#2 "               # PHP stack frame depth 2
    - "#3 "               # PHP stack frame depth 3
    - "#4 "               # PHP stack frame depth 4
    - "#5 "               # PHP stack frame depth 5
