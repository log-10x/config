# yaml-language-server: $schema=schema.json

#
# 🔟❎ GitOps configuration

# This config file pulls symbol, config and lookup files from a remote repo to
# enable centralized configuration management via GitHub.

# To learn more see https://doc.log10x.com/config/github

# The target 10x pipeline to run (e.g., run, compile) is specified in the config files pulled from the repo
tenx: any

include:

  # ---------------------------------------------------------------------------
  # Policy lane: the rate regulator's files from a policy repo
  #
  # Pulls log10x/policy/*.csv (caps.csv, actions.csv, totals.csv,
  # config-generation.csv) and mirrors them into a stable folder, by default
  # ${java.io.tmpdir}/tenx/github/log10x/policy/. With GH_ENABLED=true the rate
  # regulator's CAP_LOOKUP_FILE, ACTION_LOOKUP_FILE, TOTAL_LOOKUP_FILE and
  # CONFIG_GENERATION_FILE default to those mirrored copies
  # (pipelines/run/receive/rate/config.yaml), and every sync rewrites them in
  # place, so the lookups hot-reload. The folder must exist in the repo and
  # hold caps.csv when the engine starts: a missing folder stops the pull, and
  # a sync refreshes only the files the first pull found.

  - source: github

    options:
      # Env-var overrides: GH_ENABLED, GH_TOKEN, GH_REPO, GH_BRANCH,
      # GH_SYNC_INTERVAL, GH_DEST.
      enabled: $=TenXEnv.get("GH_ENABLED", false)

      # 'token' specifies an access token for accessing the Github repo.
      token: $=TenXEnv.get("GH_TOKEN")

      # 'repo' specifies the GitHub owner/repo from which to pull; required when enabled.
      repo: $=TenXEnv.get("GH_REPO")

      # 'branch' on 'repo' (if null, uses default repo default branch)
      branch: $=TenXEnv.get("GH_BRANCH", "main")

      # 'paths' specifies Glob patterns within 'repo' to pull. List items are
      # literal: '$=' is not evaluated inside a list.
      paths:
        - log10x/policy/*.csv

      # 'syncInterval' specifies an interval by which check to check the remote branch for updates (null to disable).
      # This interval works in conjunction with: https://doc.log10x.com/run/reload
      syncInterval: $=TenXEnv.get("GH_SYNC_INTERVAL", "30s")

      # 'destination' mirrors pulled content into a stable absolute folder,
      # after the initial pull and after every sync (atomic per-file writes,
      # mtime refreshed every sync). The pull cache itself lives under a
      # sha-addressed temp folder whose path changes per commit, so lookup
      # options point HERE. The folder must be writable by the engine user:
      # the shipped container runs as uid 1000, so a root-level path like
      # /policy fails the launch. Requires engine >= 1.1.69.
      destination: $=TenXEnv.get("GH_DEST", TenXEnv.get("java.io.tmpdir", "/tmp") + "/tenx/github")

  # ---------------------------------------------------------------------------
  # Files lane: other files a config repo carries
  #
  # Pulls the 'paths' below from the same repo, for files such as the compact
  # receiver's lookup or a mute file. Enabled on its own (GH_FILES_ENABLED) so
  # a policy repo does not need these folders. The compact-receiver reload test
  # runs it with GH_FILES_ENABLED=true and GH_REPO pointing at the test repo.
  # To pull other folders, edit 'paths' in a fork of this config.

  - source: github

    options:
      enabled: $=TenXEnv.get("GH_FILES_ENABLED", false)

      token: $=TenXEnv.get("GH_TOKEN")

      repo: $=TenXEnv.get("GH_REPO")

      branch: $=TenXEnv.get("GH_BRANCH", "main")

      # Literal glob list, as above.
      paths:
        - test/*.csv

      syncInterval: $=TenXEnv.get("GH_SYNC_INTERVAL", "30s")

      # Unset = no mirror. With GH_DEST set, the files land beside the policy
      # lane's, e.g. GH_DEST=/tmp/policy + rateReceiverLookupFile=/tmp/policy/test/mutes.csv
      destination: $=TenXEnv.get("GH_DEST")

# ---------------------------------------------------------------------------
# Alternative source: kubernetes ConfigMap
#
# Pulls regulator CSV / lookup files from a kube-apiserver ConfigMap. Same
# polling cadence + atomic write semantics as the github lane, but the
# source-of-truth lives in the cluster rather than a remote repo. Useful
# for air-gapped deployments and for tooling that already writes intent
# (e.g. log10x-mcp configure_engine) directly into kubernetes.
#
# DISABLED unless K8S_ENABLED=true on the pod. The MCP install wizard sets
# it (with a seeded ConfigMap + RBAC read grant), so a wizard-installed
# receiver picks up caps.csv / actions.csv / config-generation.csv without
# hand-wiring. The seed matters: the first pull runs on the launch thread
# and a MISSING ConfigMap aborts startup; the lookup loader also refuses a
# rows-less CSV, so the seeded files each carry one no-op `tenx-seed` row.
#
# Auth uses the pod's mounted service-account token (re-read each poll so
# BoundServiceAccountTokenVolume rotation is honored). CA cert is re-loaded
# on mtime change. Atomic file replacement via temp + Files.move.

  - source: kubernetes

    options:
      # Env-var overrides: K8S_ENABLED, K8S_NAMESPACE, K8S_CONFIGMAP,
      # K8S_SYNC_INTERVAL, K8S_API_SERVER, K8S_TOKEN_PATH, K8S_CA_PATH.
      enabled: $=TenXEnv.get("K8S_ENABLED", false)

      # 'namespace' defaults to the pod's namespace (read from the mounted
      # service-account token volume). Override for cross-namespace pulls.
      namespace: $=TenXEnv.get("K8S_NAMESPACE")

      # 'configMap' is the ConfigMap name to pull from.
      configMap: $=TenXEnv.get("K8S_CONFIGMAP", "log10x-action-intent")

      # 'keys' is a list of glob patterns over the ConfigMap data + binaryData
      # keys. Only keys matching at least one glob are written to disk.
      keys:
        - "*.csv"
        - "*.json"

      # 'syncInterval', floored to 60s by the scheduler (mirrors github lane).
      syncInterval: $=TenXEnv.get("K8S_SYNC_INTERVAL", "30s")

      # 'apiServer' default is the in-cluster URL. Override for out-of-cluster
      # smoke tests (e.g., https://127.0.0.1:6443 via kubectl proxy).
      apiServer: $=TenXEnv.get("K8S_API_SERVER", "https://kubernetes.default.svc")

      # Paths to the projected service-account token + CA cert. Defaults are
      # the standard in-cluster mount points; override only for non-standard
      # service-account volume layouts.
      tokenPath: $=TenXEnv.get("K8S_TOKEN_PATH", "/var/run/secrets/kubernetes.io/serviceaccount/token")
      caPath: $=TenXEnv.get("K8S_CA_PATH", "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")
